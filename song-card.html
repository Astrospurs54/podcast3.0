            </button>
        </div>
        <div class="song-info">
            <div class="song-title">mama</div>
            <div class="artist">Aymos</div>
            
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            
            <div class="time-display">

            </div>
        </div>
        
        <audio class="song-audio" src="assets/rec music/aymos/aymos_mama_official_music_video_mp3_44663.mp3"></audio>
    </div>

    <!--Add as many song cards as you want... -->

</div>
<script>
    
    // Get all song cards
    const songCards = document.querySelectorAll(".song-card");
    let currentAudio = null;   // Keeps track of the currently playing audio

    songCards.forEach(card => {
        const audio = card.querySelector('.song-audio');
        const playButton = card.querySelector('.play-button');
        const progressContainer = card.querySelector('.progress-container');
        const progressBar = card.querySelector('.progress-bar');
        const currentTimeEl = card.querySelector('.current-time');
        const durationEl = card.querySelector('.duration');

        // Play/Pause handler
        playButton.addEventListener('click', () => {
            // If another song is playing, pause it first
            if (currentAudio && currentAudio !== audio) {
                currentAudio.pause();
                // Reset previous play button
                document.querySelectorAll('.play-button').forEach(btn => {
                    if (btn !== playButton) btn.innerHTML = '<div class="play-icon">▶</div>';
                });
            }

            if (audio.paused) {
                audio.play();
                playButton.innerHTML = '<div class="play-icon">❚❚</div>'; // Pause icon
                currentAudio = audio;
            } else {
                audio.pause();
                playButton.innerHTML = '<div class="play-icon">▶</div>';
            }
        });

        // Update progress bar
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        // Set duration when metadata loads
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        // Seek when clicking progress bar
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        // Reset when song ends
        audio.addEventListener('ended', () => {
            progressBar.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            playButton.innerHTML = '<div class="play-icon">▶</div>';
            currentAudio = null;
        });
    });

    // Helper function: seconds → MM:SS
    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return "0:00";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `\( {min}: \){sec.toString().padStart(2, '0')}`;
    }
